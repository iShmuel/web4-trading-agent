<h2 id="4-the-8-specialized-quantitative-internal-agents">4. The 8 Specialized Quantitative Internal Agents</h2>
<p>Collaborating in a continuous 60-second real-time execution loop:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-mermaid">flowchart LR
    A[1. Data Scout] --&gt; B[2. Momentum Hunter]
    A --&gt; C[3. Mean Reversion]
    A --&gt; D[4. Pairs Stat-Arb]
    B --&gt; E[5. Coordinator Arbiter]
    C --&gt; E
    D --&gt; E
    E --&gt; F[6. Risk Governor]

</code></pre>

<th style="text-align:center">#</th>

<tr>
<td style="text-align:center"><strong>1</strong></td>
<td style="text-align:left"><strong>Data Scout Agent</strong> (<code>core/data_loader.py</code>)</td>
<td style="text-align:left">Multi-Venue Sensor &amp; Data Integrity</td>
<td style="text-align:left"><strong>Prevents &quot;Garbage-In, Garbage-Out&quot;</strong>: Without it, API lag, missing bars, or corrupt ticks would trigger phantom trades on ghost prices or buy into overheated funding traps.</td>
<td style="text-align:left">Polls Binance CCXT (Crypto) &amp; Yahoo Finance (US Equities), fetches 8h perpetual funding rates, validates OHLCV bars, and blocks trading if data is stale (&gt;120m).</td>
</tr>
<tr>
<td style="text-align:center"><strong>2</strong></td>
<td style="text-align:left"><strong>Momentum Hunter Agent</strong> (<code>strategies/momentum.py</code>)</td>
<td style="text-align:left">Trend Expansion Breakout Engine</td>
<td style="text-align:left"><strong>Captures Massive Multi-Week Bull Runs</strong>: Without a dedicated trend-follower that lets winners run, the bot would cap its upside and miss +40% expansions (<code>NEAR</code>, <code>LINK</code>, <code>AMD</code>).</td>
<td style="text-align:left">Scans for 20-bar Donchian breakouts confirmed above the 32 EMA and 200 Macro EMA. Rides big winners with an upward-only 2.25x ATR trailing stop.</td>
</tr>
<tr>
<td style="text-align:center"><strong>3</strong></td>
<td style="text-align:left"><strong>Mean Reversion Agent</strong> (<code>strategies/mean_reversion.py</code>)</td>
<td style="text-align:left">Rubber-Band Extremes &amp; Scale-Out</td>
<td style="text-align:left"><strong>Profits in the 70% Sideways Chop</strong>: Markets consolidate 70% of the time where breakout-only bots get whipsawed to death. We need a rubber-band engine to harvest range extremes.</td>
<td style="text-align:left">Buys deeply oversold dips (<code>Price &lt;= Lower BB</code> &amp; <code>RSI &lt; 30</code>) with a green bounce confirmation and shorts overbought spikes (<code>RSI &gt; 75</code>). Banks 50% halfway to the 20-SMA.</td>
</tr>

<h3 id="2-multi-timeframe-trend-anchor-4h1d-filter">2. Multi-Timeframe Trend Anchor (4h/1D Filter)</h3>
